name: Update ratings

on:
  schedule:
    - cron: "0 8 * * *"   # daily incremental update
    - cron: "0 9 1 * *"   # monthly full re-scan (1st of month): heals quarantined/edited posts
  workflow_dispatch:
    inputs:
      full:
        description: "Full re-scan of the whole channel"
        type: boolean
        default: false

concurrency:
  group: update-ratings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m src.main ${{ (github.event.schedule == '0 9 1 * *' || inputs.full) && '--full' || '' }}
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
